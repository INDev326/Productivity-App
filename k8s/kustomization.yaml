apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: folio

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: folio-academic-os
      app.kubernetes.io/managed-by: kustomize

images:
  - name: folio-app
    newName: folio-app
    newTag: latest
