apiVersion: v1
kind: Secret
metadata:
  name: folio-secret
  namespace: folio
  labels:
    app.kubernetes.io/name: folio
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # Optional: Database connection string if running with Postgres / Neon
  DATABASE_URL: ""
  # Optional: 32+ character random secret for Better Auth sessions
  BETTER_AUTH_SECRET: ""
  # Optional: xAI API key for AI Tutor Grok reasoning
  XAI_API_KEY: ""
