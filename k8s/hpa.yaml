apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: folio-hpa
  namespace: folio
  labels:
    app.kubernetes.io/name: folio
    app.kubernetes.io/component: autoscaler
    app.kubernetes.io/part-of: folio-academic-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: folio-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
