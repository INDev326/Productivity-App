services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: folio-app:latest
    container_name: folio-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - VITE_AUTH_ENABLED=false
      # Optional: set DATABASE_URL if connecting to external or local Postgres
      # - DATABASE_URL=postgres://folio:folio_secret@postgres:5432/folio_db
      # - BETTER_AUTH_SECRET=your-random-32-character-secret-key-here
      # - XAI_API_KEY=your-xai-api-key-here
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - folio-network

  # Optional PostgreSQL service for persistent relational storage
  postgres:
    image: postgres:16-alpine
    container_name: folio-postgres
    restart: unless-stopped
    profiles:
      - with-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio_secret
      POSTGRES_DB: folio_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio -d folio_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - folio-network

networks:
  folio-network:
    driver: bridge

volumes:
  postgres-data:
